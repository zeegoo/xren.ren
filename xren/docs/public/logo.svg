<!--
  L' · 玄光护体 (程序员版)
  意象：玄光护体 + 袖底飘出代码灵气 + 玄光环如代码括号环绕
  气质：气场 · 神秘 · 道骨仙风 · 但又是写代码的人
  关键改动：
    1) 玄光环改成 { } 括号弧度（程序员符号感）
    2) 袖口飘出 { } < > ; = 等微缩代码符号
    3) 玄青光改为略带终端绿（暗示 terminal）
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="sky-l2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5EBD8"/>
      <stop offset="100%" stop-color="#E0D5B7"/>
    </linearGradient>
    <radialGradient id="xuan-aura-l2" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#0F1A24" stop-opacity="0.30"/>
      <stop offset="40%" stop-color="#2A4A5A" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#2A4A5A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="robe-l2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A2530"/>
      <stop offset="100%" stop-color="#0A1018"/>
    </linearGradient>
    <linearGradient id="cloud-l2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#E8DCC4" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- 天色 -->
  <rect x="0" y="0" width="200" height="200" fill="url(#sky-l2)"/>

  <!-- 玄光大圆 -->
  <circle cx="100" cy="100" r="85" fill="url(#xuan-aura-l2)"/>

  <!-- 玄光环：左 { 与右 } 括号弧（程序员符号感） -->
  <!-- 左括号 { 加粗加大 -->
  <g fill="none" stroke="#1A3540" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <path d="M 42 78 Q 34 100 42 122"/>
    <path d="M 42 78 Q 56 75 56 86"/>
    <path d="M 42 122 Q 56 125 56 114"/>
  </g>
  <!-- 左括号外圈虚线（强化存在感） -->
  <g fill="none" stroke="#1A3540" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3" opacity="0.45">
    <path d="M 32 70 Q 22 100 32 130"/>
    <path d="M 32 70 Q 50 66 50 78"/>
    <path d="M 32 130 Q 50 134 50 122"/>
  </g>

  <!-- 右括号 } 加粗加大 -->
  <g fill="none" stroke="#1A3540" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <path d="M 158 78 Q 166 100 158 122"/>
    <path d="M 158 78 Q 144 75 144 86"/>
    <path d="M 158 122 Q 144 125 144 114"/>
  </g>
  <!-- 右括号外圈虚线 -->
  <g fill="none" stroke="#1A3540" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3" opacity="0.45">
    <path d="M 168 70 Q 178 100 168 130"/>
    <path d="M 168 70 Q 150 66 150 78"/>
    <path d="M 168 130 Q 150 134 150 122"/>
  </g>

  <!-- 脚下祥云 -->
  <path d="M 25 158
           Q 35 150 55 156
           Q 70 148 90 156
           Q 110 148 130 156
           Q 150 148 170 156
           Q 185 152 188 158
           Q 185 165 170 162
           L 35 162
           Q 22 162 25 158 Z"
        fill="url(#cloud-l2)" opacity="0.9"/>

  <!-- 仙人剪影（玄袍，立于云上） -->
  <g transform="translate(100 95)">
    <!-- 长袍 -->
    <path d="M -10 30
             L 10 30
             L 18 60
             L -18 60
             Z"
          fill="url(#robe-l2)"/>
    <!-- 腰带 -->
    <rect x="-12" y="42" width="24" height="2.5" fill="#B23A48" opacity="0.85"/>
    <!-- 身躯 -->
    <path d="M -7 26 L 7 26 L 9 32 L -9 32 Z" fill="#1A2530"/>
    <!-- 头部 -->
    <circle cx="0" cy="14" r="9" fill="#0F1A24"/>
    <!-- 发髻 -->
    <ellipse cx="0" cy="3" rx="5" ry="3" fill="#050A12"/>
    <rect x="-2" y="0" width="4" height="4" fill="#050A12"/>
    <!-- 袖（迎风） -->
    <path d="M -8 28 Q -22 22 -30 8 Q -16 28 -10 32 Z" fill="#1A2530"/>
    <path d="M 8 28 Q 22 22 30 8 Q 16 28 10 32 Z" fill="#1A2530"/>
  </g>

  <!-- 袖底飘出的代码字符（程序员的灵气） -->
  <g font-family="'Courier New', 'Menlo', 'Monaco', monospace"
     font-weight="700" fill="#3A7A8A" opacity="0.85">
    <text x="58" y="35" font-size="9">{</text>
    <text x="68" y="28" font-size="7" opacity="0.7">;</text>
    <text x="76" y="40" font-size="8" opacity="0.8">&lt;</text>
    <text x="85" y="32" font-size="9">&gt;</text>
    <text x="118" y="30" font-size="8" opacity="0.7">=</text>
    <text x="128" y="40" font-size="9">}</text>
    <text x="138" y="32" font-size="7" opacity="0.7">_</text>
  </g>

  <!-- 头顶玄纹（道冠高耸） -->
  <g fill="none" stroke="#2A4A5A" stroke-width="0.8" opacity="0.6">
    <path d="M 88 12 Q 100 6 112 12"/>
    <path d="M 86 8 Q 100 1 114 8" opacity="0.5"/>
  </g>

  <!-- 玄光灵气散点（顶部小点） -->
  <g fill="#2A4A5A" opacity="0.5">
    <circle cx="170" cy="50" r="1"/>
    <circle cx="40" cy="55" r="0.8"/>
    <circle cx="30" cy="48" r="0.6"/>
  </g>
</svg>