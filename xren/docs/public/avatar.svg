<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!--
    玄芯散人 · 极简水墨版
    设计原则：线稿写意，单色为主，留白即意境
    元素：圆框 + 发髻 + 一根玉簪 + 脸型 + V 领道袍 + 胸前玄字玉牌
  -->
  <defs>
    <linearGradient id="rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C9A961"/>
      <stop offset="100%" stop-color="#8B7234"/>
    </linearGradient>
  </defs>

  <!-- 玉牌圆框 -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="url(#rim)" stroke-width="2.5"/>

  <!-- 顶部朱砂点（极小） -->
  <circle cx="100" cy="14" r="2" fill="#B23A48"/>

  <!-- ===== 发髻 + 玉簪 ===== -->
  <!-- 发髻（单笔弧线） -->
  <path d="M 80 55 Q 100 35 120 55"
        fill="#1A1A1A" stroke="#1A1A1A" stroke-width="1"/>
  <!-- 玉簪（一道横线 + 两端点） -->
  <line x1="76" y1="58" x2="124" y2="58" stroke="#4A8C8C" stroke-width="2" stroke-linecap="round"/>
  <circle cx="76" cy="58" r="2.5" fill="#6FBFBF"/>
  <circle cx="124" cy="58" r="2.5" fill="#C9A961"/>

  <!-- ===== 脸（鹅蛋形，极简） ===== -->
  <path d="M 100 65
           Q 80 65 80 90
           Q 80 115 100 122
           Q 120 115 120 90
           Q 120 65 100 65 Z"
        fill="#F4DCC0"/>

  <!-- 眉（一笔弧） -->
  <path d="M 88 88 Q 94 85 100 88" stroke="#1A1A1A" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M 100 88 Q 106 85 112 88" stroke="#1A1A1A" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- 眼（点睛之笔） -->
  <circle cx="91" cy="96" r="1.8" fill="#1A1A1A"/>
  <circle cx="109" cy="96" r="1.8" fill="#1A1A1A"/>

  <!-- 唇（一点朱砂） -->
  <circle cx="100" cy="108" r="1.5" fill="#B23A48"/>

  <!-- ===== 道袍（V 领轮廓） ===== -->
  <!-- 肩 + 袖缘 -->
  <path d="M 100 122
           L 75 135
           L 60 185
           L 140 185
           L 125 135 Z"
        fill="none" stroke="#1F3340" stroke-width="2" stroke-linejoin="round"/>
  <!-- V 领内衬 -->
  <path d="M 88 122 L 100 138 L 112 122"
        fill="none" stroke="#1F3340" stroke-width="2" stroke-linejoin="round"/>

  <!-- 胸前玄字玉牌（核心标识） -->
  <rect x="89" y="148" width="22" height="22" rx="2"
        fill="#4A8C8C" stroke="#C9A961" stroke-width="1.5"/>
  <text x="100" y="167" text-anchor="middle"
        font-family="'LXGW WenKai', '霞鹜文楷', 'KaiTi', 'STKaiti', serif"
        font-size="16" font-weight="700"
        fill="#F5EFE0">玄</text>
</svg>